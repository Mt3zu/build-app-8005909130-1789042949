name: Build Custom Fast APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Make script executable
        run: chmod +x build.sh
      - name: Build APK
        run: ./build.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-App
          path: my_app/platforms/android/app/build/outputs/apk/debug/*.apk
